# Local stack: Postgres for the processed-matches ledger (db.py) and the
# app image itself, writing to a named volume instead of local disk - the
# same shape production will have on the droplet, just with a plain local
# volume standing in for whatever's actually mounted there.
#
#   docker compose up -d postgres        # just the database
#   docker compose build app             # build the app image
#   docker compose run --rm app python3 run.py --dry-run
#   docker compose run --rm app python3 run.py
#   docker compose down                  # stop (data survives - see volumes)
#   docker compose down -v               # stop AND wipe all data - careful
#
# `app` has no `ports` and isn't meant for `docker compose up -d app` - it's
# a one-shot pipeline run (see Dockerfile), not a server, until the serving
# layer exists.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: match_analysis
      POSTGRES_USER: match_analysis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U match_analysis"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://match_analysis:devpassword@postgres:5432/match_analysis}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
