# Local stack: Postgres for the processed-matches ledger (db.py) and the
# Coach's Brief/auth data, the app image for one-shot/manual runs,
# `scheduler` for the automated data pull, and `webapp` for the actual
# dashboard - writing to a named volume instead of local disk, the same
# shape production will have on the droplet, just with a plain local volume
# standing in for whatever's actually mounted there.
#
#   docker compose up -d postgres        # just the database
#   docker compose build app             # build the app image
#   docker compose run --rm app python3 run.py --dry-run
#   docker compose run --rm app python3 run.py
#   docker compose up -d scheduler       # automated Mon/Thu pulls, persistent
#   docker compose up -d webapp          # the dashboard, on :5050
#   docker compose down                  # stop (data survives - see volumes)
#   docker compose down -v               # stop AND wipe all data - careful
#
# `app` has no `ports` and isn't meant for `docker compose up -d app` - it's
# a one-shot pipeline run (see Dockerfile) for a manual/on-demand build.
# `scheduler` and `webapp` are the opposite: built from the same image, but
# left running (restart: unless-stopped) - `scheduler` so the Mon/Thu pulls
# happen on their own once deployed (see scheduler.py), `webapp` because
# it's the actual site someone signs into.
#
# PRODUCTION: the ${POSTGRES_PASSWORD:-devpassword} / DATABASE_URL defaults
# below are for local testing ONLY. Set real values for both in the
# droplet's own .env before deploying there - see .env.example. Likewise
# AUTH_USERS/FLASK_SECRET_KEY for `webapp` (see auth.py): leaving either
# unset means nobody can sign in, or everyone gets logged out at random.
#
# PRODUCTION: Postgres publishes no port at all, and `webapp` publishes
# only to 127.0.0.1 - neither is reachable from outside the droplet by
# itself. On the shared droplet, `webapp` is reached by a colleague's
# existing Caddy container, itself in its own Docker Compose project - not
# a host-level proxy, so reaching it needs `webapp` joined onto that
# project's Docker network rather than (or alongside) the 127.0.0.1 port
# above. See docker-compose.prod.yml, applied as an extra layer on top of
# this file rather than edited into it, and deploy/CADDY_SETUP.md for the
# exact block to hand the colleague. Once Caddy is actually routing to us
# with real TLS, also set FORCE_HTTPS=1 so the session cookie is marked
# Secure (see webapp.py) - Caddy sets X-Forwarded-Proto on its own, so
# ProxyFix there needs no further config either way.
#
# name: pins this project's name explicitly - the working directory has
# spaces ("post match analysis"), which Compose would otherwise sanitize
# into something unpredictable, and a shared droplet needs every project's
# containers/volumes/network clearly distinct from a colleague's.
name: match-analysis

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: match_analysis
      POSTGRES_USER: match_analysis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    # No `ports:` - nothing outside the `app`/`scheduler`/`webapp` containers
    # needs to reach Postgres directly. They all talk to it over the
    # Docker-internal `postgres` hostname on the compose network already.
    # For a one-off manual check, `docker compose exec postgres psql -U
    # match_analysis` works without publishing anything to the host at all.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U match_analysis"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      # Hardcoded to the `postgres` service hostname, not a
      # ${DATABASE_URL:-default} fallback - .env's own DATABASE_URL (set
      # for non-Docker local testing, pointing at localhost via the port
      # mapping below) is not a fallback-worthy empty value from Compose's
      # point of view, so that pattern silently fed the wrong hostname
      # into every container instead of ever hitting its own default.
      # `environment:` here overrides whatever env_file also injects for
      # the same name, which is what actually makes this win.
      DATABASE_URL: postgresql://match_analysis:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/match_analysis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/data

  scheduler:
    build: .
    env_file:
      - .env
    environment:
      # Hardcoded to the `postgres` service hostname, not a
      # ${DATABASE_URL:-default} fallback - .env's own DATABASE_URL (set
      # for non-Docker local testing, pointing at localhost via the port
      # mapping below) is not a fallback-worthy empty value from Compose's
      # point of view, so that pattern silently fed the wrong hostname
      # into every container instead of ever hitting its own default.
      # `environment:` here overrides whatever env_file also injects for
      # the same name, which is what actually makes this win.
      DATABASE_URL: postgresql://match_analysis:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/match_analysis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/data
    command: ["python3", "scheduler.py"]
    restart: unless-stopped

  webapp:
    build: .
    env_file:
      - .env
    environment:
      # Hardcoded to the `postgres` service hostname, not a
      # ${DATABASE_URL:-default} fallback - .env's own DATABASE_URL (set
      # for non-Docker local testing, pointing at localhost via the port
      # mapping below) is not a fallback-worthy empty value from Compose's
      # point of view, so that pattern silently fed the wrong hostname
      # into every container instead of ever hitting its own default.
      # `environment:` here overrides whatever env_file also injects for
      # the same name, which is what actually makes this win.
      DATABASE_URL: postgresql://match_analysis:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/match_analysis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/data
    # No `ports:` here on purpose - the droplet's colleague-run Caddy
    # reaches this container over the shared `lofc_default` Docker network
    # instead (see docker-compose.prod.yml), not a published port at all,
    # per their explicit request not to publish anything on the host (the
    # droplet's firewall only allows 22/80/443 inbound anyway). Local dev
    # gets its port back from docker-compose.override.yml, which plain
    # `docker compose up` picks up automatically but an explicit `-f
    # docker-compose.yml -f docker-compose.prod.yml` (used on the droplet)
    # does not.
    # --bind 0.0.0.0: the gunicorn process itself still has to listen on
    # every interface *inside* the container, same reasoning as any
    # container - its own loopback isn't reachable from outside it either
    # way, published port or Docker network.
    # --timeout 600: gunicorn's own default (30s) was silently killing the
    # worker mid-request on /selector/resolve and /brief/<id>/save, both of
    # which shell out synchronously to build_prematch.py/build_report.py -
    # a live Impect pull + PDF render that routinely takes well over 30s on
    # its own, and much longer whenever Impect's rate limiting kicks in
    # (seen constantly throughout this project's own usage). The browser
    # just saw "Internal Server Error" with nothing in the response to
    # explain why - confirmed via the worker logs ("WORKER TIMEOUT") on a
    # live pre-match generation attempt.
    command: ["gunicorn", "--bind", "0.0.0.0:5050", "--workers", "3", "--timeout", "600",
              "--access-logfile", "-", "webapp:app"]
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
