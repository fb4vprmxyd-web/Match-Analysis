<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Leyton Orient — Match Analysis{% endblock %}</title>
<style>
  :root {
    --bg: #171E29;
    --panel: #1E2735;
    --sidebar: #131924;
    --ink: #FFFFFF;
    --muted: #8B97A8;
    --grid: #2E3949;
    --team: #E4002B;
    --good: #8FE388;
    --bad: #FF2D2D;
    --amber: #F4C430;
    --info: #4EB6E3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--grid);
  }
  header .kicker {
    color: var(--team);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  header .title { font-size: 22px; font-weight: 800; margin: 0; }
  main { max-width: 860px; margin: 0 auto; padding: 32px; }
  a { color: var(--info); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .muted { color: var(--muted); font-size: 13.5px; }
  textarea {
    width: 100%;
    min-height: 220px;
    background: var(--sidebar);
    color: var(--ink);
    border: 1px solid var(--grid);
    border-radius: 8px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  button, .btn {
    display: inline-block;
    background: var(--team);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    font-family: inherit;
    line-height: 1.2;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--grid);
    color: var(--ink);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--grid); font-size: 14px; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge.yes { background: var(--good); color: #0B3D0B; }
  .badge.no { background: var(--grid); color: var(--muted); }
  .readback-line {
    padding: 10px 0;
    border-bottom: 1px solid var(--grid);
    font-size: 14px;
    line-height: 1.5;
  }
  .readback-line:last-child { border-bottom: none; }
  form { margin: 0; }
</style>
</head>
<body>
<!-- No header/nav here on purpose: these pages are normally viewed inside
     dashboard.html's iframe panes, whose sidebar already gives full
     navigation context - a second nav bar inside the iframe would just be
     redundant chrome. Each page still sets its own <title> block for the
     case where it's opened directly (a shared link), and the content
     itself (opponent name, match id) establishes context on its own. -->
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
